        unit: "count"
        lower_is_better: true
        category: stability
      - key: measurements_kubeApiserver_restarts_range
        display: "Kube API Server Restarts"
        unit: "count"
        lower_is_better: true
        category: stability
      # --- Scheduler ---
      - key: measurements_schedulerPendingPodsCount_range
        display: "Scheduler Pending Pods"
        unit: "count"
        lower_is_better: true
        category: cluster_infra

