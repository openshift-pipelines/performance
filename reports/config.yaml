# Performance Comparison Report Generator — Configuration
# Metric definitions, test IDs, and analysis thresholds.
#
# Metric keys match the JSONB label_values field names in PostgreSQL
# (without the leading `__` prefix stored in the database).

thresholds:
  significant_change_pct: 5     # below this = "stable"
  major_change_pct: 15          # above this = "major improvement/regression"
  mad_threshold: 2.5            # MAD multiplier for outlier detection
  outlier_metric_ratio: 0.5     # if >50% of metrics flagged, exclude the run
  min_runs_after_exclusion: 2   # warn if fewer than 2 runs survive
  default_runs: 3               # how many recent runs to fetch per version

components:
  pipelines:
    display_name: "Pipelines Controller"
    group_by: "parameters_test_concurrent"
    group_label: "concurrent"
    variants:
      standard:
        display_name: "Standard (Default)"
        new_test_id: 423
        legacy_test_id: 391
        legacy_filter:
          ha_enabled: false
          qbt_enabled: false
      ha_deployments:
        display_name: "HA - Deployments"
        new_test_id: 419
        legacy_test_id: 391
        legacy_filter:
          ha_enabled: true
          controller_type: "deployments"
          qbt_enabled: false
      ha_statefulsets:
        display_name: "HA - StatefulSets"
        new_test_id: 421
        legacy_test_id: 391
        legacy_filter:
          ha_enabled: true
          controller_type: "statefulSets"
          qbt_enabled: false
      qbt:
        display_name: "QBT (non-HA)"
        new_test_id: 422
        legacy_test_id: 391
        legacy_filter:
          ha_enabled: false
          qbt_enabled: true
      ha_qbt:
        display_name: "HA + QBT"
        new_test_id: 420
        legacy_test_id: 391
        legacy_filter:
          ha_enabled: true
          controller_type: "deployments"
          qbt_enabled: true
    metrics:
      # --- Pipeline Execution ---
      - key: results_PipelineRuns_count_succeeded
        display: "PipelineRun Succeeded"
        unit: "count"
        lower_is_better: false
        category: pipeline_performance
      - key: results_PipelineRuns_count_failed
        display: "PipelineRun Failed"
        unit: "count"
        lower_is_better: true
        category: pipeline_performance
      - key: results_PipelineRuns_duration_avg
        display: "PipelineRun Duration (avg)"
        unit: "s"
        lower_is_better: true
        category: pipeline_performance
      - key: results_PipelineRuns_Success_duration_avg
        display: "Succeeded PR Duration (avg)"
        unit: "s"
        lower_is_better: true
        category: pipeline_performance
      - key: results_PipelineRuns_Success_pending_avg
        display: "Succeeded PR Pending (avg)"
        unit: "s"
        lower_is_better: true
        category: pipeline_performance
      - key: results_PipelineRuns_Success_running_avg
        display: "Succeeded PR Running (avg)"
        unit: "s"
        lower_is_better: true
        category: pipeline_performance
      # --- TaskRun Execution ---
      - key: results_TaskRuns_count_succeeded
        display: "TaskRun Succeeded"
        unit: "count"
        lower_is_better: false
        category: pipeline_performance
      - key: results_TaskRuns_count_failed
        display: "TaskRun Failed"
        unit: "count"
        lower_is_better: true
        category: pipeline_performance
      - key: results_TaskRuns_duration_avg
        display: "TaskRun Duration (avg)"
        unit: "s"
        lower_is_better: true
        category: pipeline_performance
      - key: results_TaskRuns_Success_duration_avg
        display: "Succeeded TR Duration (avg)"
        unit: "s"
        lower_is_better: true
        category: pipeline_performance
      - key: results_TaskRuns_Success_pending_avg
        display: "Succeeded TR Pending (avg)"
        unit: "s"
        lower_is_better: true
        category: pipeline_performance
      - key: results_TaskRuns_Success_running_avg
        display: "Succeeded TR Running (avg)"
        unit: "s"
        lower_is_better: true
        category: pipeline_performance
      # --- TaskRun-to-Pod Scheduling ---
      - key: results_TaskRunsToPods_creationTimestampDiff_mean
        display: "TaskRun→Pod Creation Lag (mean)"
        unit: "s"
        lower_is_better: true
        category: controller_health
      - key: results_TaskRunsToPods_creationTimestampDiff_max
        display: "TaskRun→Pod Creation Lag (max)"
        unit: "s"
        lower_is_better: true
        category: controller_health
      # --- Pipelines Controller ---
      - key: measurements_tektonPipelinesController_cpu_mean
        display: "Controller CPU (mean)"
        unit: "cores"
        lower_is_better: true
        category: controller_health
      - key: measurements_tektonPipelinesController_cpu_max
        display: "Controller CPU (max)"
        unit: "cores"
        lower_is_better: true
        category: controller_health
      - key: measurements_tektonPipelinesController_memory_mean
        display: "Controller Memory (mean)"
        unit: "bytes"
        lower_is_better: true
        category: controller_health
      - key: measurements_tektonPipelinesController_memory_max
        display: "Controller Memory (max)"
        unit: "bytes"
        lower_is_better: true
        category: controller_health
      - key: measurements_tektonTektonPipelinesControllerWorkqueueDepth_mean
        display: "Workqueue Depth (mean)"
        unit: "count"
        lower_is_better: true
        category: controller_health
      - key: measurements_tektonPipelinesControllerClientLatencyAverage_mean
