        display: "Cluster CPU (mean)"
        unit: "cores"
        lower_is_better: true
        category: cluster_infra
      - key: measurements_clusterMemoryUsageRssTotal_mean
        display: "Cluster Memory (mean)"
        unit: "bytes"
        lower_is_better: true
        category: cluster_infra
      - key: measurements_apiserver_cpu_mean
        display: "API Server CPU (mean)"
        unit: "cores"
        lower_is_better: true
        category: cluster_infra
      - key: measurements_apiserver_memory_mean
        display: "API Server Memory (mean)"
        unit: "bytes"
        lower_is_better: true
        category: cluster_infra
      - key: measurements_kubeApiserver_cpu_mean
        display: "Kube API Server CPU (mean)"
        unit: "cores"
        lower_is_better: true
        category: cluster_infra
      - key: measurements_kubeApiserver_memory_mean
        display: "Kube API Server Memory (mean)"
        unit: "bytes"
        lower_is_better: true
        category: cluster_infra
      # --- etcd ---
      - key: measurements_etcdMvccDbTotalSizeInBytesAverage_mean
        display: "etcd DB Size (mean)"
        unit: "bytes"
        lower_is_better: true
        category: etcd
      - key: measurements_etcdMvccDbTotalSizeInUseInBytesAverage_mean
        display: "etcd DB In Use (mean)"
        unit: "bytes"
        lower_is_better: true
