# Category display names for the output JSON
categories:
  pipeline_performance:
    display_name: "Pipeline Execution"
    description: "PipelineRun and TaskRun throughput, duration, and scheduling"
  signing:
    display_name: "Signing Performance"
    description: "Tekton Chains signing throughput, duration, and completeness"
  ingestion:
    display_name: "Results Ingestion"
    description: "Results watcher ingestion throughput, latency, and reliability"
  api_load:
    display_name: "Results API (Load Test)"
    description: "Locust load test results for Results API endpoints"
  controller_health:
    display_name: "Controller Health"
    description: "Controller CPU, memory, workqueue depth, and latency"
  cluster_infra:
    display_name: "Cluster & Infrastructure"
    description: "Cluster-wide CPU, memory, API server, and scheduler metrics"
  etcd:
    display_name: "etcd"
    description: "etcd database size, request latency, and stability"
  stability:
    display_name: "Stability"
    description: "Component restarts — all values should be 0"
