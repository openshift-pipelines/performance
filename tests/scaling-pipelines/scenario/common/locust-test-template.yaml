apiVersion: locust.io/v1
kind: LocustTest
metadata:
  name: ${SCENARIO}-test
spec:
  image: locustio/locust:2.43.4
  workers: ${LOCUST_WORKERS}
  env:
    - name: RESULTS_AUTH_ENABLED
      value: "${RESULTS_AUTH_ENABLED}"
    - name: LOCUST_RUN_PHASE
      value: "${LOCUST_RUN_PHASE}"
    # The master otherwise waits only one second for worker reports after ramp-up.
    - name: LOCUST_WAIT_FOR_WORKERS_REPORT_AFTER_RAMP_UP
      value: "10"
    - name: TZ
      value: UTC
  args:
    --locustfile /home/locust/${SCENARIO}.py
    --host ${LOCUST_HOST}
    --users ${LOCUST_USERS}
    --spawn-rate ${LOCUST_SPAWN_RATE}
    --run-time ${LOCUST_DURATION}
    --headless
    ${LOCUST_EXTRA_CMD}
  locustfile:
    configMap:
      name: locust.${SCENARIO}
