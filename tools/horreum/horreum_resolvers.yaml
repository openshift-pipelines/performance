  - name: "measurements_tektonPipelinesRemoteResolvers_cpu_max"
    jsonpath: "$.measurements.\"tekton-pipelines-remote-resolvers\".cpu.max"
    description: "Maximum CPU usage for remote resolvers pod"
    filtering: false
