    change_detection_group: null

  - name: "measurements_tektonPipelinesRemoteResolvers_memory_mean"
    jsonpath: "$.measurements.\"tekton-pipelines-remote-resolvers\".memory.mean"
    description: "Mean memory usage for remote resolvers pod (bytes)"
    filtering: false
    metrics: true
    change_detection_group: "resolver_memory"

  - name: "measurements_tektonPipelinesRemoteResolvers_memory_max"
    jsonpath: "$.measurements.\"tekton-pipelines-remote-resolvers\".memory.max"
    description: "Maximum memory usage for remote resolvers pod (bytes)"
    filtering: false
