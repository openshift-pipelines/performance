    change_detection_group: "TaskRunsToPods_creation"

  # =========================================================================
  # Remote Resolvers pod (tekton-pipelines-remote-resolvers)
  # =========================================================================
  - name: "measurements_tektonPipelinesRemoteResolvers_cpu_mean"
    jsonpath: "$.measurements.\"tekton-pipelines-remote-resolvers\".cpu.mean"
    description: "Mean CPU usage for remote resolvers pod"
    filtering: false
