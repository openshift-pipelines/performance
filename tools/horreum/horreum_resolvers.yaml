  - name: "measurements_resolverQueueDurationP95_mean"
    jsonpath: "$.measurements.resolver_queue_duration_p95.mean"
    description: "Mean resolver queue duration P95 (seconds)"
    filtering: false
    metrics: true
    change_detection_group: "resolver_workqueue"

  - name: "measurements_resolverQueueDurationP95_max"
    jsonpath: "$.measurements.resolver_queue_duration_p95.max"
    description: "Maximum resolver queue duration P95 (seconds)"
